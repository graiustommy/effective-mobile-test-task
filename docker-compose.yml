services:
  postgres:
    image: postgres:16-alpine
    container_name: efftask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d subscriptions"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efftask-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${db_user}
      DB_PASSWORD: ${db_password}
      DB_NAME: ${db_name}
      DB_HOST: postgres
      DB_PORT: ${db_port}
    ports:
      - "8080:8080"
    env_file:
      - .env
  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: efftask-swagger
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      URL: http://localhost:8080/swagger.json
    depends_on:
      - app
volumes:
  pg_data:
